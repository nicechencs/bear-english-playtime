<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Bear’s English Playtime</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#fff6e0;--card:#fff;--ink:#4a2c1a;--ac:#ff8a3d;--ac2:#ffe0c2;--ok:#3bb273;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1f17;--card:#3b2c20;--ink:#ffeedd;--ac2:#5a3b24}}
:root[data-theme="dark"]{--bg:#2a1f17;--card:#3b2c20;--ink:#ffeedd;--ac2:#5a3b24}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Nunito","Comic Sans MS","PingFang SC","Microsoft YaHei",sans-serif;-webkit-tap-highlight-color:transparent}
.wrap{max-width:760px;margin:0 auto;padding:10px 12px 40px}
.stage{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-radius:24px;box-shadow:0 4px 0 var(--ac2);padding:6px 10px 10px;text-align:center}
svg{height:min(36vh,290px);width:100%;display:block}
#cap{font-size:clamp(28px,8vw,44px);font-weight:900;min-height:1.2em;color:var(--ac)}
#sub{font-size:15px;opacity:.8;min-height:1.4em}
#turn{display:none;font-weight:800;color:var(--ok);font-size:20px}#turn.on{display:block;animation:pu .6s infinite}
.bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.bar button,.tabs button{border:0;border-radius:99px;padding:8px 14px;font:inherit;font-weight:800;background:var(--ac2);color:var(--ink)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 2px 6px}.tabs button{white-space:nowrap}.tabs .sel{background:var(--ac);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.c{border:0;border-radius:20px;background:var(--card);color:var(--ink);padding:12px 6px;font:inherit;box-shadow:0 4px 0 var(--ac2);min-height:96px}
.c:active,.c.on{transform:translateY(3px);box-shadow:none;background:var(--ac2)}
.c b{display:block;font-size:19px}.c i{font-style:normal;font-size:34px;display:block}.c small{opacity:.75}
.wide{grid-column:1/-1;display:flex;align-items:center;gap:10px;text-align:left;min-height:64px;padding:12px 16px}.wide i{font-size:30px}
h3{margin:14px 4px 6px;font-size:16px}.tip{background:var(--ac2);border-radius:14px;padding:8px 12px;margin:10px 0;font-size:14px}
.f,.pr{display:none}
.face-normal .f-normal,.face-happy .f-happy,.face-sad .f-sad,.face-angry .f-angry,.face-hungry .f-hungry,.face-sleepy .f-sleepy,.face-sing .f-sing{display:inline}
#mv{transform-origin:170px 340px}svg *{transform-box:view-box}
#head{transform-origin:170px 150px}#armL{transform-origin:118px 212px}#armR{transform-origin:222px 212px}#legL{transform-origin:145px 280px}#legR{transform-origin:195px 280px}#bear{transform-origin:170px 250px}
.t{transform-box:fill-box;transform-origin:center}
@keyframes sw{0%,100%{transform:rotate(calc(var(--b,0deg) - var(--a,0deg)))}50%{transform:rotate(calc(var(--b,0deg) + var(--a,0deg)))}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes jump{0%,100%{transform:translateY(0) scale(1.06,.9)}25%{transform:translateY(0) scale(1)}55%{transform:translateY(-80px) scale(.96,1.06)}}
@keyframes jaL{0%,25%,100%{transform:rotate(0)}55%{transform:rotate(150deg)}}@keyframes jaR{0%,25%,100%{transform:rotate(0)}55%{transform:rotate(-150deg)}}
@keyframes tilt{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}
@keyframes sway{0%,100%{transform:rotate(-6deg) translateY(0)}50%{transform:rotate(6deg) translateY(-8px)}}
@keyframes shk{0%,100%{transform:translateX(-9px)}50%{transform:translateX(9px)}}
@keyframes spin{0%,100%{transform:scaleX(1)}25%,75%{transform:scaleX(0)}50%{transform:scaleX(-1)}}
@keyframes crmv{0%{transform:translateX(-30px)}100%{transform:translateX(30px)}}
@keyframes clL{0%,100%{transform:rotate(-25deg)}50%{transform:rotate(-85deg)}}@keyframes clR{0%,100%{transform:rotate(25deg)}50%{transform:rotate(85deg)}}
@keyframes kk{0%,40%,100%{transform:rotate(0)}60%{transform:rotate(-70deg)}}
@keyframes ball{0%,45%{transform:translate(0,0);opacity:1}100%{transform:translate(80px,-80px);opacity:.2}}
@keyframes jab{0%,100%{transform:rotate(-68deg)}40%{transform:rotate(-96deg)}}
@keyframes fl{0%{transform:translateY(0);opacity:0}30%{opacity:1}100%{transform:translateY(-55px);opacity:0}}
@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
@keyframes mo{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1.2)}}
@keyframes bl{0%,100%{opacity:0}50%{opacity:1}}
.fl{animation:fl 1.8s infinite}.pu{animation:pu .7s infinite}.bl{animation:bl .5s infinite}
.a-walk #legL,.a-walk #armR{animation:sw 1s infinite;--a:24deg}.a-walk #legR,.a-walk #armL{animation:sw 1s infinite;--a:24deg;animation-direction:reverse}.a-walk #mv{animation:bob 1s infinite}
.a-run #legL,.a-run #armR{animation:sw .4s infinite;--a:45deg;--b:-20deg}.a-run #legR,.a-run #armL{animation:sw .4s infinite reverse;--a:45deg;--b:20deg}.a-run #mv{animation:bob .4s infinite}
.a-jump #mv{animation:jump 1.1s infinite}.a-jump #armL{animation:jaL 1.1s infinite}.a-jump #armR{animation:jaR 1.1s infinite}
.a-clap #armL{animation:clL .6s infinite}.a-clap #armR{animation:clR .6s infinite}
.a-dance #mv{animation:sway .9s infinite}.a-dance #armL{animation:sw .9s infinite;--b:140deg;--a:25deg}.a-dance #armR{animation:sw .9s infinite reverse;--b:-140deg;--a:25deg}.a-dance #legL{animation:sw .45s infinite;--a:12deg}.a-dance #legR{animation:sw .45s infinite reverse;--a:12deg}
.a-sing #head{animation:sw 1.2s infinite;--a:7deg}.a-sing #armL{--b:35deg}.a-sing #armR{--b:-35deg}.a-sing .mo{animation:mo .45s infinite;transform-box:fill-box;transform-origin:center}
.a-kick #legR{animation:kk 1s infinite}.a-kick .ball{animation:ball 1s infinite}.a-kick #mv{animation:bob 1s infinite}
.a-wave #armR{animation:sw .5s infinite;--b:-150deg;--a:18deg}
.a-wobble #mv{animation:tilt 1.3s ease-in-out infinite}.a-wobble #armL{animation:sw 1.3s infinite;--a:20deg}.a-wobble #armR{animation:sw 1.3s infinite reverse;--a:20deg}
.a-crawl #bear{transform:rotate(80deg)}.a-crawl #head{transform:rotate(-80deg)}.a-crawl #mv{animation:crmv 2.4s ease-in-out infinite alternate}
.a-crawl #armL,.a-crawl #legR{animation:sw .8s infinite;--b:-80deg;--a:25deg}.a-crawl #armR,.a-crawl #legL{animation:sw .8s infinite reverse;--b:-80deg;--a:25deg}
.a-point #armR{animation:sw .6s infinite;--b:-92deg;--a:4deg}.a-point #head{transform:rotate(8deg)}
.a-pat #armL{animation:sw .45s infinite;--b:-42deg;--a:8deg}.a-pat #armR{animation:sw .45s infinite reverse;--b:42deg;--a:8deg}
.a-shake #mv{animation:shk .1s infinite}.a-shake #armL{animation:sw .1s infinite;--b:-20deg;--a:12deg}.a-shake #armR{animation:sw .1s infinite;--b:20deg;--a:12deg}
.a-turn #mv{animation:spin 1.8s ease-in-out infinite}
.a-snap #armR{animation:sw .5s infinite;--b:-120deg;--a:6deg}
.a-poke #armR{animation:jab .7s infinite}.a-poke .bal{animation:pu .7s infinite}
.a-happy #mv{animation:bob .6s infinite}.a-happy #armL{animation:sw .6s infinite;--b:120deg;--a:20deg}.a-happy #armR{animation:sw .6s infinite reverse;--b:-120deg;--a:20deg}
.a-sad #head{transform:rotate(-8deg) translateY(8px)}.a-sad #mv{animation:bob 2.5s infinite}
.a-angry #mv{animation:shk .18s infinite}.a-angry #armL{transform:rotate(-15deg)}.a-angry #armR{transform:rotate(15deg)}
.a-hungry #mv{animation:bob .5s infinite}.a-hungry #armL{transform:rotate(-40deg)}.a-hungry #armR{transform:rotate(40deg)}
.a-sleepy #head{animation:sw 2.5s infinite;--b:14deg;--a:5deg}.a-sleepy #mv{animation:bob 3s infinite}
</style></head><body><div class="wrap">

const A=new Audio();let rate=1,tok=0;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const NEW="crawl point pat shake turn snap poke".split(" "),OLD="walk run jump clap dance sing kick wave wobble".split(" ");
const ZH={walk:["走","🚶"],run:["跑","🏃"],jump:["跳","🤸"],clap:["鼓掌","👏"],dance:["跳舞","💃"],sing:["唱歌","🎤"],kick:["踢","⚽"],wave:["挥手","🙋"],wobble:["摇摆","🫨"],crawl:["爬（地上）","🐛"],point:["指向","👉"],pat:["轻拍","🖐"],shake:["摇动","🫨"],turn:["转动","🔄"],snap:["打响指","🫰"],poke:["戳","👆"]};
const EM={happy:["开心","😄"],sad:["难过","😢"],angry:["生气","😠"],hungry:["饿了","🤤"],sleepy:["困了","😴"]};
const TIPS={crawl:"crawl 是在地上爬；climb 才是向上爬，别混淆哦。",shake:"shake 是快速摇动（手、身体）；wobble 是中心不稳的慢摇晃，一起对比着玩。",wobble:"wobble 是慢慢左右晃；和 shake 的快速抖动不一样。",turn:"边说 turn 边原地转一圈。"};
const Q={q_name:"What’s your name?",a_name:"My name is …",q_how:"How are you?",q_age:"How old are you?",a_age:"I am three years old.",q_bg:"Are you a boy or a girl?",a_girl:"I am a girl.",a_boy:"I am a boy.",q_feel:"How do you feel?",q_can:"What can you do?",cheer:"Great job!"};
function cap(k){if(Q[k])return Q[k];if(k.startsWith("can_"))return"I can "+k.slice(4)+".";if(k.startsWith("im_"))return"I’m "+k.slice(3)+".";if(k.startsWith("feel_"))return"I feel "+k.slice(5)+".";return k}
const sv=document.getElementById("sv");
function pose(a,face){sv.setAttribute("class","");void sv.getBoundingClientRect();sv.setAttribute("class","a-"+a+" face-"+face);
 document.querySelectorAll(".pr").forEach(e=>e.style.display=e.classList.contains("pr-"+a)?"block":"none")}
const FACE={sing:"sing",sad:"sad",angry:"angry",hungry:"hungry",sleepy:"sleepy",kick:"happy"};
function say(k,ms){return new Promise(res=>{document.getElementById("cap").textContent=cap(k);A.src="data:audio/mpeg;base64,"+AU[k];A.playbackRate=rate;let d=0;const f=()=>{if(!d){d=1;res()}};A.onended=f;A.onerror=f;A.play().catch(f);setTimeout(f,6000)})}
async function run(steps){const my=++tok;A.pause();for(const s of steps){if(my!==tok)return;
 if(s.pose)pose(s.pose,s.face||FACE[s.pose]||"happy");
 if(s.sub!==undefined)document.getElementById("sub").textContent=s.sub;
 if(s.say){await say(s.say);if(my!==tok)return;}
 if(s.wait){const t=document.getElementById("turn");if(s.turn)t.classList.add("on");await sleep(s.wait*(rate<1?1.2:1));t.classList.remove("on")}}
 if(my===tok){pose("happy","happy");document.getElementById("cap").textContent="Great job!";}}
const stop=()=>{tok++;A.pause();document.getElementById("turn").classList.remove("on")};
function wordSeq(w){const z=ZH[w]||EM[w];const p=EM[w]?w:w;let s=[];
 for(let i=0;i<3;i++)s.push({pose:p,say:w,sub:z[1]+" "+z[0],wait:1.3,turn:1});
 s.push({say:EM[w]?"im_"+w:"can_"+w,wait:2,turn:1},{say:EM[w]?"feel_"+w:"can_"+w,wait:2,turn:1},{say:"cheer"});return s}
function canSeq(w){return[{pose:"happy",say:"q_can",sub:"你会做什么？ What can you do?",wait:1.3},{pose:w,say:"can_"+w,sub:ZH[w][1]+" 我会"+ZH[w][0],wait:2.2,turn:1},{say:"can_"+w,wait:2.2,turn:1},{say:"cheer"}]}
const INTRO=[
["💬","What’s your name?","你叫什么名字？",[{pose:"wave",say:"q_name",wait:2,turn:1},{say:"a_name",sub:"家长示范：My name is ___",wait:2.5,turn:1},{say:"cheer"}]],
["😊","How are you?","你好吗？",[{pose:"happy",say:"q_how",wait:1.5},{pose:"happy",say:"im_happy",wait:2,turn:1},{pose:"sleepy",say:"im_sleepy",wait:2,turn:1},{pose:"sad",say:"im_sad",wait:2,turn:1},{say:"cheer"}]],
["🎂","How old are you?","你几岁？",[{pose:"happy",say:"q_age",wait:1.8},{say:"a_age",sub:"改成你家宝宝的岁数，伸出手指",wait:2.5,turn:1},{say:"cheer"}]],
["🧒","Boy or girl?","你是男孩还是女孩？",[{pose:"happy",say:"q_bg",wait:2},{say:"a_girl",wait:2.2,turn:1},{say:"a_boy",wait:2.2,turn:1},{say:"cheer"}]],
["❤️","How do you feel?","你感觉怎么样？",[{pose:"happy",say:"q_feel",wait:1.5},...Object.keys(EM).flatMap(e=>[{pose:e,say:"feel_"+e,sub:EM[e][1]+" "+EM[e][0],wait:2,turn:1}]),{say:"cheer"}]]];
const TABS=[["1 自我介绍","复习：问答，每个都能点"],["2 动作词","复习 actions：每个词说 3 遍，再说句子"],["3 I can","复习：What can you do? I can …"],["4 新动作","新 actions：crawl point pat shake turn snap poke"],["5 新 I can","新句型：问句懂意思，I can 句要会说"]];
let cur=0;const g=document.getElementById("grid");
function card(i,b,s,fn,w){const e=document.createElement("button");e.className="c"+(w?" wide":"");e.innerHTML=w?`<i>${i}</i><span><b>${b}</b><small>${s}</small></span>`:`<i>${i}</i><b>${b}</b><small>${s}</small>`;e.onclick=()=>{document.querySelectorAll(".c.on").forEach(x=>x.classList.remove("on"));e.classList.add("on");window.scrollTo({top:0,behavior:"smooth"});fn()};g.append(e)}
function show(n){cur=n;stop();const tb=document.getElementById("tabs");tb.innerHTML="";TABS.forEach((t,i)=>{const b=document.createElement("button");b.textContent=t[0];b.className=i==n?"sel":"";b.onclick=()=>show(i);tb.append(b)});
 g.innerHTML="";const tp=document.getElementById("tip");tp.style.display="block";tp.textContent=TABS[n][1];
 if(n==0){INTRO.forEach(x=>card(x[0],x[1],x[2],()=>run(x[3]),1));Object.keys(EM).forEach(e=>card(EM[e][1],e,EM[e][0],()=>run(wordSeq(e))))}
 else{const L=n<3?OLD:NEW;L.forEach(w=>card(ZH[w][1],w,ZH[w][0],()=>{const t=TIPS[w];if(t){tp.textContent="👩‍🏫 "+t}else tp.textContent=TABS[n][1];run(n==1||n==3?wordSeq(w):canSeq(w))}))}}
document.getElementById("sp").onclick=e=>{rate=rate==1?.8:1;e.target.textContent=rate==1?"🐢 慢":"🐌 更慢"};
document.getElementById("st").onclick=stop;
document.getElementById("rd").onclick=()=>{const L=cur>=3?NEW:OLD;const w=L[Math.floor(Math.random()*L.length)];run(cur==2||cur==4?canSeq(w):wordSeq(w))};
show(1);pose("happy","happy");
</script></body></html>
